# Spring Boot Application Configuration
spring.application.name=notification-service
server.port=8081

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=100
spring.kafka.listener.ack-mode=manual_immediate

# Kafka Topic
notification.kafka.topic=${KAFKA_TOPIC:screening.notification.request}

# External Service Endpoints
notification.email.endpoint=${EMAIL_ENDPOINT:http://localhost:8080/api/email/send}
notification.sms.endpoint=${SMS_ENDPOINT:http://localhost:8080/api/sms/send}

# Retry Configuration
notification.retry.max-attempts=${MAX_RETRIES:3}
notification.retry.base-delay-ms=${BASE_DELAY_MS:1000}

# HTTP Client Configuration
notification.http.connect-timeout=10000
notification.http.read-timeout=30000

# Actuator / Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.notificationsystem=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n